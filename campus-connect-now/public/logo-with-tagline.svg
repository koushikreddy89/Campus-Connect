<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>
  
  <!-- Logo Mark (Centered at x=200, y=80) -->
  <g transform="translate(100, 20)">
    <!-- Purple Left Curve -->
    <path d="M 95,78 A 24,24 0 1,0 95,122 C 105,122 115,108 120,100 C 115,92 105,78 95,78" fill="url(#purpleGradient)" />
    <!-- Cyan Right Curve -->
    <path d="M 105,122 A 24,24 0 1,0 105,78 C 95,78 85,92 80,100 C 85,108 95,122 105,122" fill="url(#cyanGradient)" />
    <!-- Left Purple Head -->
    <circle cx="75" cy="50" r="9" fill="url(#purpleGradient)" />
    <!-- Right Cyan Head -->
    <circle cx="125" cy="50" r="9" fill="url(#cyanGradient)" />
  </g>
  
  <!-- Brand Text -->
  <text x="200" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="4" text-anchor="middle" fill="#FFFFFF">
    CAMPUS <tspan fill="url(#textGrad)">CONNECT</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="200" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#A1A1AA">
    CONNECT • COLLABORATE • BELONG
  </text>
</svg>
