<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <g>
    <!-- Purple Left Interlocking Curve -->
    <path d="M 95,78 A 24,24 0 1,0 95,122 C 105,122 115,108 120,100 C 115,92 105,78 95,78" fill="url(#purpleGradient)" />
    <!-- Cyan Right Interlocking Curve -->
    <path d="M 105,122 A 24,24 0 1,0 105,78 C 95,78 85,92 80,100 C 85,108 95,122 105,122" fill="url(#cyanGradient)" />
    <!-- Left Purple Head Dot -->
    <circle cx="75" cy="50" r="9" fill="url(#purpleGradient)" />
    <!-- Right Cyan Head Dot -->
    <circle cx="125" cy="50" r="9" fill="url(#cyanGradient)" />
  </g>
</svg>
